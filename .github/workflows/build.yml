name: Build ScreenScale16

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bash \
            curl \
            clang \
            make \
            git \
            perl \
            python3 \
            unzip \
            xz-utils \
            zstd \
            lzma \
            fakeroot \
            dpkg

      - name: Install Theos
        run: |
          git clone --recursive \
            https://github.com/theos/theos.git \
            /home/runner/theos

          echo "THEOS=/home/runner/theos" >> "$GITHUB_ENV"

      - name: Install iOS Toolchain
        run: |
          export THEOS=/home/runner/theos

          mkdir -p "$THEOS/toolchain"

          echo "Downloading iOS toolchain..."

          curl -L \
            https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-X86_64.tar.xz \
            -o /tmp/iOSToolchain.tar.xz

          tar -xJf /tmp/iOSToolchain.tar.xz \
            -C "$THEOS/toolchain"

          echo "Toolchain contents:"
          find "$THEOS/toolchain" -maxdepth 4 -type f \
            \( -name clang -o -name clang++ \) -print

      - name: Install iOS SDK
        run: |
          export THEOS=/home/runner/theos

          mkdir -p "$THEOS/sdks"

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          cp -R /tmp/theos-sdks/iPhoneOS16.5.sdk \
            "$THEOS/sdks/"

          echo "SDK:"
          ls -lah "$THEOS/sdks/iPhoneOS16.5.sdk"

      - name: Verify Theos
        run: |
          export THEOS=/home/runner/theos

          echo "===== THEOS ====="
          echo "$THEOS"

          echo "===== SDK ====="
          ls -lah "$THEOS/sdks"

          echo "===== CLANG ====="
          find "$THEOS/toolchain" \
            -type f \
            \( -name clang -o -name clang++ \) \
            -print

          echo "===== TARGET CLANG ====="
          ls -lah "$THEOS/toolchain/linux/iphone/bin/" || true

      - name: Build
        run: |
          export THEOS=/home/runner/theos

          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScale16
          path: packages/*.deb
