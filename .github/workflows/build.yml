name: Build ScreenScale16 RootHide

on:
  workflow_dispatch:


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git \
            make \
            clang \
            llvm \
            perl \
            python3 \
            curl \
            wget \
            unzip \
            xz-utils \
            zstd \
            lzma \
            dpkg

      - name: Install RootHide Theos
        run: |
          export THEOS=/home/runner/theos

          mkdir -p "$THEOS"

          curl -fsSL \
            https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos \
            -o /tmp/install-theos

          chmod +x /tmp/install-theos

          THEOS="$THEOS" /tmp/install-theos

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

      - name: Install iOS 16.5 SDK
        run: |
          export THEOS=/home/runner/theos

          mkdir -p "$THEOS/sdks"

          curl -L \
            https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          tar -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          echo "SDK:"
          ls -lah "$THEOS/sdks"

      - name: Verify RootHide Theos
        run: |
          export THEOS=/home/runner/theos

          echo "THEOS:"
          echo "$THEOS"

          echo "Theos:"
          ls -lah "$THEOS"

          echo "SDK:"
          ls -lah "$THEOS/sdks"

          echo "Clang:"
          find "$THEOS/toolchain" \
            -type f \
            \( -name clang -o -name clang++ \) \
            -print

      - name: Build RootHide package
        run: |
          export THEOS=/home/runner/theos

          make clean

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Inspect package
        run: |
          echo "Packages:"
          ls -lah packages/

          echo "DEB control:"
          for deb in packages/*.deb; do
            echo "===== $deb ====="
            dpkg-deb -I "$deb"
          done

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScale16-RootHide
          path: packages/*.deb
