name: Build ScreenScale16 RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            clang \
            llvm \
            perl \
            python3 \
            curl \
            wget \
            unzip \
            xz-utils \
            zstd \
            lzma \
            dpkg

      - name: Install RootHide Theos
        run: |
          set -e

          export THEOS=/home/runner/theos

          rm -rf "$THEOS"

          git clone \
            --depth=1 \
            --recursive \
            https://github.com/roothide/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          echo "===== THEOS ====="
          ls -lah "$THEOS"

      - name: Install iOS 16.5 SDK
        run: |
          set -e

          export THEOS=/home/runner/theos

          mkdir -p "$THEOS/sdks"

          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

          echo "Downloading iOS 16.5 SDK..."
          echo "$SDK_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "$SDK_URL" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          echo "===== SDK ARCHIVE ====="
          ls -lh /tmp/iPhoneOS16.5.sdk.tar.xz

          tar \
            -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          echo "===== INSTALLED SDK ====="
          ls -lah "$THEOS/sdks"

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          test -f \
            "$THEOS/sdks/iPhoneOS16.5.sdk/SDKSettings.json"

      - name: Install iOS toolchain
        run: |
          set -e

          export THEOS=/home/runner/theos

          mkdir -p "$THEOS/toolchain"

          ARCH="$(uname -m)"

          case "$ARCH" in
            x86_64)
              TOOLCHAIN_ARCH="linux-x86_64"
              ;;
            aarch64|arm64)
              TOOLCHAIN_ARCH="linux-arm64"
              ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          TOOLCHAIN_URL="https://github.com/L1ghtmann/llvm-project/releases/latest/download/iOSToolchain-${TOOLCHAIN_ARCH}.tar.xz"

          echo "Runner architecture: $ARCH"
          echo "Toolchain URL:"
          echo "$TOOLCHAIN_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "$TOOLCHAIN_URL" \
            -o /tmp/iOSToolchain.tar.xz

          echo "===== TOOLCHAIN ARCHIVE ====="
          ls -lh /tmp/iOSToolchain.tar.xz

          tar \
            -xJf \
            /tmp/iOSToolchain.tar.xz \
            -C "$THEOS/toolchain"

          echo "===== TOOLCHAIN FILES ====="

          find "$THEOS/toolchain" \
            -type f \
            \( \
              -name clang \
              -o -name clang++ \
              -o -name ld64.lld \
            \) \
            -print

      - name: Verify environment
        run: |
          set -e

          export THEOS=/home/runner/theos

          echo "================================"
          echo "THEOS"
          echo "================================"

          echo "$THEOS"

          test -d "$THEOS"

          echo "================================"
          echo "ROOT HIDE THEOS"
          echo "================================"

          if [ -d "$THEOS/package" ]; then
            find "$THEOS/package" \
              -maxdepth 3 \
              -type f \
              | sort
          fi

          echo "================================"
          echo "SDK"
          echo "================================"

          test -d "$THEOS/sdks/iPhoneOS16.5.sdk"

          ls -lah \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "================================"
          echo "SDK SETTINGS"
          echo "================================"

          test -f \
            "$THEOS/sdks/iPhoneOS16.5.sdk/SDKSettings.json"

          echo "================================"
          echo "TOOLCHAIN"
          echo "================================"

          find "$THEOS/toolchain" \
            -type f \
            \( \
              -name clang \
              -o -name clang++ \
              -o -name ld64.lld \
            \) \
            -print

          echo "================================"
          echo "ROOTHIDE SCHEME"
          echo "================================"

          grep -R "roothide" \
            "$THEOS" \
            --include='*.mk' \
            --include='*.py' \
            --include='*.pl' \
            2>/dev/null \
            | head -30 || true

      - name: Build RootHide package
        run: |
          set -e

          export THEOS=/home/runner/theos

          echo "================================"
          echo "CLEAN"
          echo "================================"

          make clean

          echo "================================"
          echo "BUILD SCREEN SCALE 16"
          echo "================================"

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Inspect package
        run: |
          set -e

          echo "================================"
          echo "PACKAGES"
          echo "================================"

          ls -lah packages/

          echo "================================"
          echo "DEB INFO"
          echo "================================"

          for deb in packages/*.deb; do
            echo
            echo "===== $deb ====="
            dpkg-deb -I "$deb"
          done

          echo "================================"
          echo "DEB CONTENT"
          echo "================================"

          for deb in packages/*.deb; do
            echo
            echo "===== $deb ====="
            dpkg-deb -c "$deb"
          done

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScale16-RootHide
          path: packages/*.deb
          if-no-files-found: error
