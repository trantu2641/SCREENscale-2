name: Build ScreenScale16 RootHide

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          set -e

          sudo apt-get update

          sudo apt-get install -y \
            git \
            make \
            clang \
            llvm \
            perl \
            python3 \
            curl \
            wget \
            unzip \
            xz-utils \
            zstd \
            lzma \
            dpkg \
            fakeroot

      - name: Install RootHide Theos
        run: |
          set -e

          export THEOS=/home/runner/theos

          rm -rf "$THEOS"

          git clone \
            --depth=1 \
            --recursive \
            https://github.com/roothide/theos.git \
            "$THEOS"

          echo "THEOS=$THEOS" >> "$GITHUB_ENV"

          echo "===== ROOT HIDE THEOS ====="
          ls -lah "$THEOS"

      - name: Install iOS 16.5 SDK
        run: |
          set -e

          export THEOS=/home/runner/theos

          mkdir -p "$THEOS/sdks"

          SDK_URL="https://github.com/theos/sdks/releases/download/master-146e41f/iPhoneOS16.5.sdk.tar.xz"

          echo "========================================"
          echo "Downloading iOS 16.5 SDK"
          echo "========================================"
          echo "$SDK_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "$SDK_URL" \
            -o /tmp/iPhoneOS16.5.sdk.tar.xz

          echo "SDK archive:"
          ls -lh /tmp/iPhoneOS16.5.sdk.tar.xz

          tar \
            -xJf \
            /tmp/iPhoneOS16.5.sdk.tar.xz \
            -C "$THEOS/sdks"

          echo "========================================"
          echo "Installed SDK"
          echo "========================================"

          ls -lah "$THEOS/sdks"

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          test -f \
            "$THEOS/sdks/iPhoneOS16.5.sdk/SDKSettings.json"

      - name: Install iOS Toolchain
        run: |
          set -e

          export THEOS=/home/runner/theos

          mkdir -p "$THEOS/toolchain"

          ARCH="$(uname -m)"

          echo "Runner architecture: $ARCH"

          case "$ARCH" in
            x86_64)
              TOOLCHAIN_FILE="iOSToolchain-x86_64.tar.xz"
              ;;
            aarch64)
              TOOLCHAIN_FILE="iOSToolchain-aarch64.tar.xz"
              ;;
            *)
              echo "Unsupported architecture: $ARCH"
              exit 1
              ;;
          esac

          TOOLCHAIN_URL="https://github.com/L1ghtmann/llvm-project/releases/latest/download/$TOOLCHAIN_FILE"

          echo "========================================"
          echo "Installing iOS Toolchain"
          echo "========================================"

          echo "Toolchain file:"
          echo "$TOOLCHAIN_FILE"

          echo "Toolchain URL:"
          echo "$TOOLCHAIN_URL"

          curl \
            --fail \
            --location \
            --retry 5 \
            --retry-delay 3 \
            "$TOOLCHAIN_URL" \
            -o /tmp/iOSToolchain.tar.xz

          echo "Toolchain archive:"
          ls -lh /tmp/iOSToolchain.tar.xz

          tar \
            -xJf \
            /tmp/iOSToolchain.tar.xz \
            -C "$THEOS/toolchain"

          echo "========================================"
          echo "Toolchain installed"
          echo "========================================"

          find "$THEOS/toolchain" \
            -maxdepth 6 \
            -type f \
            \( \
              -name clang \
              -o -name clang++ \
              -o -name ld64.lld \
            \) \
            -print

          echo "========================================"
          echo "Checking clang"
          echo "========================================"

          test -x \
            "$THEOS/toolchain/linux/iphone/bin/clang"

          "$THEOS/toolchain/linux/iphone/bin/clang" \
            --version

      - name: Verify Theos environment
        run: |
          set -e

          export THEOS=/home/runner/theos

          echo "========================================"
          echo "THEOS"
          echo "========================================"

          echo "$THEOS"

          echo "========================================"
          echo "SDK"
          echo "========================================"

          test -d \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          ls -lah \
            "$THEOS/sdks/iPhoneOS16.5.sdk"

          echo "========================================"
          echo "TOOLCHAIN"
          echo "========================================"

          ls -lah \
            "$THEOS/toolchain/linux/iphone/bin"

          echo "========================================"
          echo "CLANG"
          echo "========================================"

          "$THEOS/toolchain/linux/iphone/bin/clang" \
            --version

          echo "========================================"
          echo "ROOT HIDE PACKAGE SCHEME"
          echo "========================================"

          grep -R "roothide" \
            "$THEOS/makefiles" \
            "$THEOS/package" \
            2>/dev/null \
            | head -30 || true

      - name: Build RootHide package
        run: |
          set -e

          export THEOS=/home/runner/theos

          echo "========================================"
          echo "Cleaning"
          echo "========================================"

          make clean

          echo "========================================"
          echo "Building ScreenScale16"
          echo "========================================"

          make package \
            FINALPACKAGE=1 \
            THEOS_PACKAGE_SCHEME=roothide

      - name: Inspect DEB
        run: |
          set -e

          echo "========================================"
          echo "PACKAGES"
          echo "========================================"

          ls -lah packages/

          echo "========================================"
          echo "DEB INFORMATION"
          echo "========================================"

          for deb in packages/*.deb; do
            echo
            echo "===== $deb ====="
            dpkg-deb -I "$deb"
          done

          echo "========================================"
          echo "DEB CONTENT"
          echo "========================================"

          for deb in packages/*.deb; do
            echo
            echo "===== $deb ====="
            dpkg-deb -c "$deb"
          done

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScale16-RootHide
          path: packages/*.deb
          if-no-files-found: error
