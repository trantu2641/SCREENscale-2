name: Build ScreenScale16

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang \
            llvm \
            make \
            git \
            perl \
            python3 \
            unzip \
            xz-utils \
            zstd \
            curl \
            wget

      - name: Install Theos
        run: |
          git clone --recursive https://github.com/theos/theos.git /home/runner/theos
          echo "THEOS=/home/runner/theos" >> "$GITHUB_ENV"

      - name: Install iOS SDKs
        run: |
          mkdir -p /home/runner/theos/sdks

          git clone --depth 1 \
            https://github.com/theos/sdks.git \
            /tmp/theos-sdks

          find /tmp/theos-sdks -maxdepth 1 -type d -name 'iPhoneOS*.sdk' \
            -exec cp -R {} /home/runner/theos/sdks/ \;

          echo "Installed SDKs:"
          ls -lah /home/runner/theos/sdks

      - name: Install Theos Linux toolchain
        run: |
          mkdir -p /home/runner/theos/toolchain/linux

          git clone --recursive --depth 1 \
            https://github.com/theos/llvm-project.git \
            /tmp/llvm-project

          cd /tmp/llvm-project

          ./build-toolchain-linux.sh \
            -o /home/runner/theos/toolchain/linux

      - name: Verify toolchain
        run: |
          export THEOS=/home/runner/theos

          echo "Checking clang..."
          ls -lah "$THEOS/toolchain/linux/iphone/bin/" || true

          echo "Checking clang++..."
          find "$THEOS/toolchain/linux" -name clang -o -name clang++

      - name: Build
        run: |
          export THEOS=/home/runner/theos

          echo "THEOS=$THEOS"
          echo "SDK:"
          ls "$THEOS/sdks"

          make package FINALPACKAGE=1

      - name: Upload DEB
        uses: actions/upload-artifact@v4
        with:
          name: ScreenScale16
          path: packages/*.deb
